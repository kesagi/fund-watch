  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:#f8fafc; color:#0f172a;
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif; }
  h1 { font-size:17px; margin:0 0 2px; }
  .sub { font-size:11.5px; color:#64748b; margin-bottom:12px; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
  @media (max-width:760px){ .cards{grid-template-columns:1fr;} }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:12px 14px; }
  .card .name { font-size:12.5px; font-weight:600; color:#334155; display:flex; align-items:center; gap:6px; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
  .card .nav { font-size:24px; font-weight:700; margin:4px 0 2px; font-variant-numeric:tabular-nums; }
  .card .chg { font-size:13px; font-weight:600; }
  .card .meta { font-size:11px; color:#94a3b8; margin-top:4px; }
  .up { color:#dc2626; } .down { color:#2563eb; } .flat { color:#64748b; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; margin-bottom:10px; }
  .seg { display:inline-flex; background:#e2e8f0; border-radius:8px; padding:2px; }
  .seg button { border:0; background:transparent; padding:5px 10px; font-size:12px; border-radius:6px;

  .seg button.on { background:#fff; color:#0f172a; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.12); }
  .chartbox { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:12px; height:390px; position:relative; }
  .foot { font-size:10.5px; color:#94a3b8; margin-top:10px; line-height:1.5; }

const FUNDS = [

  { id:'rnq', short:'楽天NASDAQ100', name:'楽天・プラス・NASDAQ-100インデックス・ファンド', color:'#dc2626', raw:RAW_RNQ, axis:'y1' },
  { id:'fang', short:'FANG+', name:'iFreeNEXT FANG+インデックス', color:'#16a34a', raw:RAW_FANG, axis:'y2' }
];
const LS = { mode:'fw_mode', period:'fw_period' };
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
let mode = lsGet(LS.mode) || 'price';
let period = parseInt(lsGet(LS.period) || '183', 10);
const DATA = {};
let chart = null;

const $ = s => document.querySelector(s);
const fmtY = n => '¥' + n.toLocaleString('ja-JP');
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

for (const f of FUNDS){
  const m = new Map();
  for (const ent of f.raw.split(';')){
    if (!ent) continue;
    const [d,v] = ent.split(',');
    if (d && v) m.set(d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8), parseInt(v,10));
  }
  DATA[f.id] = m;
}
function seriesOf(id){ return Array.from(DATA[id].entries()).sort((a,b)=> a[0]<b[0]?-1:1); }

function renderCards(){
  const el = $('#cards'); el.innerHTML='';
  for (const f of FUNDS){
    const s = seriesOf(f.id);
    if (!s.length) continue;
    const [d,v] = s[s.length-1];
    const prev = s.length>1 ? s[s.length-2][1] : null;
    let chgHtml = '<span class="flat">—</span>';
    if (prev){
      const c = v-prev, p = (c/prev*100);
      const cls = c>0?'up':(c<0?'down':'flat'), sg = c>0?'+':'';
      chgHtml = '<span class="'+cls+'">'+sg+c.toLocaleString()+'円 ('+sg+p.toFixed(2)+'%)</span>';
    }
    el.insertAdjacentHTML('beforeend',
      '<div class="card"><div class="name"><span class="dot" style="background:'+f.color+'"></span>'+f.name+'</div>'
      + '<div class="nav">'+fmtY(v)+'</div><div class="chg">前日比 '+chgHtml+'</div>'
      + '<div class="meta">基準日: '+d+'</div></div>');
  }
}
function cutoffStr(){
  if (!period) return '';
  const d = new Date(); d.setDate(d.getDate()-period);
  return ymd(d);
}
function render(){
  renderCards();
  const cut = cutoffStr();
  const labelSet = new Set();
  for (const f of FUNDS) for (const d of DATA[f.id].keys()) if (d >= cut) labelSet.add(d);
  const labels = Array.from(labelSet).sort();
  if (!labels.length) return;

  const datasets = FUNDS.map((f,i) => {
    const map = DATA[f.id];
    const s = seriesOf(f.id);
    let vals;
    if (mode === 'price'){
      vals = labels.map(d => map.has(d) ? map.get(d) : null);
    } else if (mode === 'return'){
      let base = null;
      for (const d of labels){ if (map.has(d)){ base = map.get(d); break; } }
      vals = labels.map(d => (map.has(d) && base) ? (map.get(d)/base-1)*100 : null);
    } else {
      const idx = new Map(s.map(([d],k)=>[d,k]));
      vals = labels.map(d => {
        const k = idx.get(d);
        if (k === undefined || k === 0) return null;
        return (s[k][1]/s[k-1][1]-1)*100;
      });
    }
    return {
      label: f.short, data: vals, borderColor: f.color,
      backgroundColor: mode==='daily' ? f.color+'cc' : f.color+'22',
      yAxisID: mode==='price' ? f.axis : 'y',
      borderWidth: 1.8, pointRadius: 0, pointHitRadius: 6, spanGaps: true,
      tension: 0.1, fill: false
    };
  });

  const pctTick = v => v.toFixed(mode==='daily'?1:0) + '%';
  const scales = { x: { ticks: { maxTicksLimit: 8, maxRotation: 0, font:{size:10} }, grid: { display:false } } };
  if (mode === 'price'){
    scales.y  = { position:'left',  ticks:{ font:{size:10}, color:FUNDS[0].color, callback:v=>v.toLocaleString() } };
    scales.y1 = { position:'right', ticks:{ font:{size:10}, color:FUNDS[1].color, callback:v=>v.toLocaleString() }, grid:{ drawOnChartArea:false } };
    scales.y2 = { position:'right', ticks:{ font:{size:10}, color:FUNDS[2].color, callback:v=>v.toLocaleString() }, grid:{ drawOnChartArea:false } };
  } else {
    scales.y = { ticks:{ font:{size:10}, callback:pctTick } };
  }

  const cfg = {
    type: mode==='daily' ? 'bar' : 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode:'index', intersect:false },
      plugins: {
        legend: { labels:{ boxWidth:12, font:{size:11} } },
        tooltip: { callbacks: { label: ctx => {
          const v = ctx.parsed.y; if (v==null) return '';
          if (mode==='price') return ' '+ctx.dataset.label+': '+fmtY(v);
          return ' '+ctx.dataset.label+': '+(v>0?'+':'')+v.toFixed(2)+'%';
        } } }
      },
      scales
    }
  };
  if (chart){ chart.destroy(); }
  if (typeof Chart === 'undefined'){
    $('.chartbox').innerHTML = '<div style="padding:24px;font-size:13px;color:#64748b">グラフ部品を読み込めませんでした。ブラウザで開き直してください。</div>';
    return;
  }
  chart = new Chart($('#chart'), cfg);
}
function bindSeg(sel, attr, get, set){
  const seg = $(sel);
  const sync = () => { for (const b of seg.querySelectorAll('button')) b.classList.toggle('on', b.dataset[attr] == String(get())); };
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    set(b.dataset[attr]); sync(); render();
  });
  sync();
}
bindSeg('#modeSeg','m', ()=>mode, v=>{ mode=v; lsSet(LS.mode,v); });
bindSeg('#periodSeg','p', ()=>period, v=>{ period=parseInt(v,10); lsSet(LS.period,v); });

render();
